    /* ── Layout ─────────────────────── */
    .page {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px 60px 40px;
    }

    /* ── Center ─────────────────────── */
    .center {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 860px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.2rem, 12vw, 11.5rem);
      line-height: 0.87;
      letter-spacing: 0.015em;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(.22,1,.36,1) 0.45s forwards;
    }

    /* round dot */
    .h1-line2 {
      display: inline-flex;
      align-items: flex-end;
    }
    .dot {
      display: inline-block;
      width:  0.14em;
      height: 0.14em;
      background: #ED1566;
      border-radius: 50%;
      margin-left: 0.05em;
      margin-left: 0.06em;
      margin-bottom: 0.11em;
    }

    .subtitle {
      font-size: clamp(0.8rem, 1.4vw, 0.95rem);
      font-weight: 300;
      color: rgba(171, 192, 213, 0.88);
      line-height: 1.75;
      max-width: 440px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.75s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      width: fit-content;
      padding-bottom: 5px;
      border-bottom: 1px solid #ED1566;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 1s forwards;
      transition: color 0.25s;
    }
    .cta:hover { color: #ED1566; }
    .cta svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.25s;
    }
    .cta:hover svg { transform: translateX(5px); }

    /* ── Bottom bar ─────────────────── */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      animation: fadeIn 1s ease 1.3s forwards;
    }
    /* Neutralize Safari iOS auto-links */
    .bottom-copy a,
    .bottom-copy a:link,
    .bottom-copy a:visited {
      color: inherit !important;
      text-decoration: none !important;
      pointer-events: none;
    }
    .bottom-copy {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: rgba(171, 192, 213, 0.38);
    }
    .bottom-link {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(171, 192, 213, 0.38);
      text-decoration: none;
      transition: color 0.25s;
    }
    .bottom-link:hover { color: #fff; }


    /* ── Email icon ─────────────────── */
    .email-icon {
      position: fixed;
      top: 44px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 1s ease 0.4s forwards;
      transition: color 0.25s;
    }
    .email-icon:hover { color: #fff; }

    .email-icon-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    /* Pulsing ring */
    .email-icon-wrap::before,
    .email-icon-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(237,21,102,0.6);
      animation: ringPulse 5s ease-out infinite;
    }
    .email-icon-wrap::after {
      animation-delay: 0.4s;
      border-color: rgba(237,21,102,0.3);
    }
    @keyframes ringPulse {
      0%   { transform: scale(1);    opacity: 0.8; }
      40%  { transform: scale(1.9);  opacity: 0; }
      100% { transform: scale(1.9);  opacity: 0; }
    }

    .email-icon-circle {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s;
    }
    .email-icon:hover .email-icon-circle {
      background: rgba(237,21,102,0.15);
      border-color: rgba(237,21,102,0.5);
    }
    .email-icon-circle svg {
      width: 17px;
      height: 17px;
    }

    .email-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .email-icon { top: 36px; left: 28px; }
      .email-label { display: none; }
    }

    /* ── Animations ─────────────────── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Mobile ─────────────────────── */
    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .page {
        height: auto;
        min-height: 100svh;
        padding: 36px 28px 32px;
      }
      .logo { width: 130px; }
      .center { gap: 20px; }
      .bottom { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
